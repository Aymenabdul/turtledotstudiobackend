spring:
  application:
    name: studio-crm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: 10GB
    max-http-form-post-size: 10GB
    connection-timeout: 3600000 # 1 hour for large 10GB transfers
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 86400000 # 24 hours
    refresh-token-expiration-ms: 604800000 # 7 days
  storage:
    root-dir: ./storage
  gallery:
    base-url: http://localhost:3000/gallery/
  portal-url: ${APP_PORTAL_URL:http://localhost:3000}
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173

logging:
  level:
    root: INFO
    com.turtledot.studio: DEBUG
    org.springframework.security: INFO
